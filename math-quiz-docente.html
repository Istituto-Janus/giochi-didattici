<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Quiz — Tool Docente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px;
    }

    .page { max-width: 700px; margin: 0 auto; }

    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      margin-bottom: 32px;
    }

    h1 { font-size: 1.5rem; color: #1a202c; margin-bottom: 6px; }

    .subtitle { color: #718096; font-size: 0.95rem; margin-bottom: 32px; }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      color: #2d3748;
      margin-bottom: 20px;
      transition: border-color 0.18s;
    }

    input:focus, select:focus { outline: none; border-color: #4f46e5; }

    .genera-btn {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }

    .genera-btn:hover:not(:disabled) { background: #4338ca; }
    .genera-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    .status {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .status.loading { background: #eef2ff; color: #4f46e5; display: block; }
    .status.success { background: #f0fff4; color: #276749; display: block; }
    .status.error   { background: #fff5f5; color: #c53030; display: block; }

    .link-box {
      margin-top: 24px;
      background: #f7fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      display: none;
    }

    .link-box p { font-size: 0.85rem; color: #718096; margin-bottom: 8px; }

    .link-box .link-url {
      font-size: 0.95rem;
      color: #4f46e5;
      font-weight: 600;
      word-break: break-all;
    }

    .copy-btn {
      margin-top: 10px;
      padding: 8px 18px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .copy-btn:hover { background: #4338ca; }

    .preview { margin-top: 24px; display: none; }

    .preview h3 { font-size: 1rem; color: #2d3748; margin-bottom: 12px; }

    .q-item {
      background: #f7fafc;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .q-item strong { color: #2d3748; display: block; margin-bottom: 6px; }

    .q-item .opzioni {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .q-item .opzioni span { color: #4a5568; }
    .q-item .opzioni span.corretta { color: #276749; font-weight: 600; }

    .elenco-container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }

    .elenco-container h2 { font-size: 1.2rem; color: #1a202c; margin-bottom: 20px; }

    .quiz-card {
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .quiz-card-info strong { display: block; color: #2d3748; font-size: 0.95rem; margin-bottom: 4px; }
    .quiz-card-info span { font-size: 0.82rem; color: #718096; }

    .quiz-card-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn-small {
      padding: 7px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-copia { background: #4f46e5; color: white; }
    .btn-copia:hover { background: #4338ca; }
    .btn-apri { background: #e2e8f0; color: #2d3748; }
    .btn-apri:hover { background: #cbd5e0; }

    .elenco-loading { color: #718096; font-size: 0.95rem; text-align: center; padding: 20px 0; }
    .elenco-empty { color: #a0aec0; font-size: 0.95rem; text-align: center; padding: 20px 0; }

    .refresh-btn {
      background: none;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #4a5568;
      cursor: pointer;
      margin-bottom: 16px;
      float: right;
    }

    .refresh-btn:hover { border-color: #4f46e5; color: #4f46e5; }
  </style>
</head>
<body>
<div class="page">

  <div class="container">
    <h1>🧮 Math Quiz — Tool Docente</h1>
    <p class="subtitle">Genera un quiz di matematica con AI e condividilo con i tuoi studenti.</p>

    <label for="titolo">Titolo del quiz</label>
    <input type="text" id="titolo" placeholder="Es. Algebra di base — Classe 3A" />

    <label for="argomento">Argomento</label>
    <input type="text" id="argomento" placeholder="Es. equazioni di primo grado, frazioni, limiti..." />

    <label for="livello">Livello</label>
    <select id="livello">
      <option value="aritmetica">Aritmetica (scuola media / biennio)</option>
      <option value="algebra">Algebra (biennio / triennio)</option>
      <option value="geometria">Geometria</option>
      <option value="analisi">Analisi (triennio / liceo scientifico)</option>
    </select>

    <button class="genera-btn" id="genera-btn" onclick="genera()">Genera Quiz</button>

    <div class="status" id="status"></div>

    <div class="link-box" id="link-box">
      <p>🔗 Link da condividere con gli studenti:</p>
      <div class="link-url" id="link-url"></div>
      <button class="copy-btn" onclick="copiaLink()">Copia link</button>
    </div>

    <div class="preview" id="preview">
      <h3>Anteprima domande generate:</h3>
      <div id="preview-list"></div>
    </div>
  </div>

  <div class="elenco-container">
    <h2>📋 Quiz creati</h2>
    <button class="refresh-btn" onclick="caricaElenco()">↻ Aggiorna</button>
    <div style="clear:both"></div>
    <div id="elenco-lista"><div class="elenco-loading">Caricamento...</div></div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://tageubqfxkshigrriiyw.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhZ2V1YnFmeGtzaGlncnJpaXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDE2NTgsImV4cCI6MjA5NTI3NzY1OH0.S3exwqcf5LZCTOUzRo0RqrmfO_S3qwyqKk6PVCoIw44";
  const PROXY_URL = "https://matching-proxy.pietro-dipalo.workers.dev";
  const BASE_URL  = "https://giochi.istitutojanus.it";

  function slugify(str) {
    return str.toLowerCase()
      .replace(/[àáâã]/g, 'a').replace(/[èéêë]/g, 'e')
      .replace(/[ìíîï]/g, 'i').replace(/[òóôõ]/g, 'o')
      .replace(/[ùúûü]/g, 'u')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .substring(0, 60);
  }

  async function chiamaAI(prompt) {
    const res = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 4000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!res.ok) throw new Error("Errore nella chiamata AI.");
    const data = await res.json();
    return data.content[0].text.trim();
  }

  // Parsing testo libero → array domande
  // Formato atteso dall'AI:
  // ==1==
  // DOMANDA: testo
  // A: opzione
  // B: opzione
  // C: opzione
  // D: opzione
  // CORRETTA: B
  function parsaDomandeTesto(testo) {
    const domande = [];
    // Splitta sui blocchi ==N==
    const blocchi = testo.split(/==\d+==/).filter(b => b.trim());

    for (const blocco of blocchi) {
      const righe = blocco.split('\n').map(r => r.trim()).filter(Boolean);
      let domanda = '';
      const opzioni = [];
      let corretta = 0;
      const lettere = ['A', 'B', 'C', 'D'];

      for (const riga of righe) {
        if (riga.startsWith('DOMANDA:')) {
          domanda = riga.replace('DOMANDA:', '').trim();
        } else if (riga.startsWith('A:')) {
          opzioni[0] = riga.replace('A:', '').trim();
        } else if (riga.startsWith('B:')) {
          opzioni[1] = riga.replace('B:', '').trim();
        } else if (riga.startsWith('C:')) {
          opzioni[2] = riga.replace('C:', '').trim();
        } else if (riga.startsWith('D:')) {
          opzioni[3] = riga.replace('D:', '').trim();
        } else if (riga.startsWith('CORRETTA:')) {
          const lettera = riga.replace('CORRETTA:', '').trim().toUpperCase();
          corretta = lettere.indexOf(lettera);
          if (corretta < 0) corretta = 0;
        }
      }

      if (domanda && opzioni.length === 4) {
        domande.push({ domanda, opzioni, corretta });
      }
    }
    return domande;
  }

  // Parsing svolgimenti testo libero
  function parsaSvolgimenti(testo, n) {
    const svolgimenti = [];
    for (let i = 1; i <= n; i++) {
      const re = new RegExp(`---${i}---\\s*([\\s\\S]*?)(?=---${i+1}---|$)`);
      const m = testo.match(re);
      if (m) {
        const passi = m[1].trim().split('|').map(p => p.trim()).filter(Boolean);
        svolgimenti.push(passi);
      } else {
        svolgimenti.push([]);
      }
    }
    return svolgimenti;
  }

  async function genera() {
    const titolo    = document.getElementById("titolo").value.trim();
    const argomento = document.getElementById("argomento").value.trim();
    const livello   = document.getElementById("livello").value;

    if (!titolo || !argomento) { alert("Compila titolo e argomento."); return; }

    const btn = document.getElementById("genera-btn");
    btn.disabled = true;
    document.getElementById("link-box").style.display = "none";
    document.getElementById("preview").style.display = "none";

    try {
      // ── CHIAMATA 1: testo libero, zero JSON ──
      setStatus("loading", "⏳ Generazione domande (1/2)...");

      const prompt1 = `Sei un insegnante di matematica esperto. Genera esattamente 10 domande a scelta multipla sull'argomento: "${argomento}" (livello: ${livello}).

Usa ESATTAMENTE questo formato per ogni domanda, niente di diverso:

==1==
DOMANDA: testo della domanda
A: prima opzione
B: seconda opzione
C: terza opzione
D: quarta opzione
CORRETTA: A

==2==
DOMANDA: testo della domanda
A: prima opzione
B: seconda opzione
C: terza opzione
D: quarta opzione
CORRETTA: B

E cosi via fino a ==10==

Regole:
- Usa solo testo semplice in italiano
- Niente simboli matematici speciali, niente LaTeX
- Per le frazioni scrivi "1/2", per gli esponenti scrivi "x^2"
- La risposta CORRETTA deve essere una sola lettera: A, B, C o D
- Genera esattamente 10 domande numerate da ==1== a ==10==`;

      const raw1 = await chiamaAI(prompt1);
      const domande = parsaDomandeTesto(raw1);

      if (domande.length === 0) {
        throw new Error("Nessuna domanda estratta. Riprova.");
      }

      // ── CHIAMATA 2: svolgimenti in testo libero con LaTeX ──
      setStatus("loading", `⏳ Generazione svolgimenti (2/2) per ${domande.length} domande...`);

      const elenco = domande.map((d, i) =>
        `${i + 1}. ${d.domanda} [Risposta corretta: ${d.opzioni[d.corretta]}]`
      ).join("\n");

      const prompt2 = `Sei un insegnante di matematica. Per ciascuna delle seguenti ${domande.length} domande, scrivi uno svolgimento didattico passo-passo.

Domande:
${elenco}

FORMATO DI RISPOSTA — rispetta esattamente questa struttura:
---1---
Passo 1: testo del primo passo | Passo 2: testo del secondo passo | Passo 3: testo conclusivo
---2---
Passo 1: testo | Passo 2: testo
---3---
...e così via fino a ---${domande.length}---

Regole:
- Ogni svolgimento su UNA SOLA RIGA, passi separati da " | "
- Massimo 4 passi per domanda
- Puoi usare LaTeX inline con $ $ per formule (es: $\\frac{1}{2}$, $x^{2}$, $\\sqrt{x}$, $\\lim_{x \\to 0}$)
- Niente testo introduttivo, inizia direttamente con ---1---`;

      const raw2 = await chiamaAI(prompt2);
      const svolgimenti = parsaSvolgimenti(raw2, domande.length);

      // Abbina svolgimenti
      const domandeFinali = domande.map((d, i) => ({
        ...d,
        svolgimento: svolgimenti[i] || []
      }));

      // ── SALVATAGGIO SU SUPABASE ──
      setStatus("loading", "💾 Salvataggio su Supabase...");

      const slug = slugify(titolo) + "-" + Date.now().toString(36);

      const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/MathQuiz`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          Prefer: "return=minimal"
        },
        body: JSON.stringify({ titolo, slug, contenuto: domandeFinali })
      });

      if (!dbRes.ok) throw new Error("Errore Supabase: " + await dbRes.text());

      setStatus("success", `✅ Quiz creato con ${domandeFinali.length} domande e svolgimenti!`);

      const link = `${BASE_URL}/math-quiz/${slug}`;
      document.getElementById("link-url").textContent = link;
      document.getElementById("link-box").style.display = "block";

      mostraAnteprima(domandeFinali);
      caricaElenco();

    } catch(e) {
      setStatus("error", "❌ " + (e.message || "Errore sconosciuto."));
    } finally {
      btn.disabled = false;
    }
  }

  function setStatus(tipo, msg) {
    const el = document.getElementById("status");
    el.className = "status " + tipo;
    el.textContent = msg;
  }

  function copiaLink() {
    const link = document.getElementById("link-url").textContent;
    navigator.clipboard.writeText(link).then(() => {
      const btn = document.querySelector(".copy-btn");
      btn.textContent = "✓ Copiato!";
      setTimeout(() => btn.textContent = "Copia link", 2000);
    });
  }

  function mostraAnteprima(domande) {
    const list = document.getElementById("preview-list");
    list.innerHTML = "";
    domande.forEach((d, i) => {
      const div = document.createElement("div");
      div.className = "q-item";
      const opzioniHtml = d.opzioni.map((op, idx) =>
        `<span class="${idx === d.corretta ? 'corretta' : ''}">${idx === d.corretta ? '✓ ' : ''}${op}</span>`
      ).join("");
      div.innerHTML = `<strong>${i + 1}. ${d.domanda}</strong><div class="opzioni">${opzioniHtml}</div>`;
      list.appendChild(div);
    });
    document.getElementById("preview").style.display = "block";
  }

  async function caricaElenco() {
    const lista = document.getElementById("elenco-lista");
    lista.innerHTML = '<div class="elenco-loading">Caricamento...</div>';

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/MathQuiz?select=titolo,slug,created_at&order=created_at.desc`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      const data = await res.json();

      if (!data.length) {
        lista.innerHTML = '<div class="elenco-empty">Nessun quiz creato ancora.</div>';
        return;
      }

      lista.innerHTML = "";
      data.forEach(q => {
        const link = `${BASE_URL}/math-quiz/${q.slug}`;
        const data_fmt = new Date(q.created_at).toLocaleDateString('it-IT', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });

        const card = document.createElement("div");
        card.className = "quiz-card";
        card.innerHTML = `
          <div class="quiz-card-info">
            <strong>${q.titolo}</strong>
            <span>Creato il ${data_fmt}</span>
          </div>
          <div class="quiz-card-actions">
            <button class="btn-small btn-copia" onclick="copiaLinkCard('${link}', this)">Copia link</button>
            <button class="btn-small btn-apri" onclick="window.open('${link}', '_blank')">Apri</button>
          </div>
        `;
        lista.appendChild(card);
      });

    } catch(e) {
      lista.innerHTML = '<div class="elenco-empty">Errore nel caricamento elenco.</div>';
    }
  }

  function copiaLinkCard(link, btn) {
    navigator.clipboard.writeText(link).then(() => {
      btn.textContent = "✓ Copiato!";
      setTimeout(() => btn.textContent = "Copia link", 2000);
    });
  }

  caricaElenco();
</script>
</body>
</html>
